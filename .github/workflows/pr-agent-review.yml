name: PR-Agent review

# Reviews each same-repository pull request with PR-Agent on the OpenAI API, billed to the
# API organization that holds OPENAI_KEY. The review job fails when the review does not
# complete. Findings are posted inline and in one persistent summary comment, and the
# findings job fails while any of them is still open.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    # Fork pull requests get no secrets, and drafts are reviewed once marked ready.
    # There is deliberately no issue_comment trigger: the repository is public and PR-Agent
    # does not check who wrote a slash command, so any commenter could spend API credits.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # PR-Agent 0.49.0 exits successfully without reviewing when GITHUB_TOKEN is missing,
      # and only logs a missing model key, so both are checked here to keep the check honest.
      - name: Check credentials
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$OPENAI_KEY" ]; then echo "::error::The OPENAI_KEY secret is not set."; exit 1; fi
          if [ -z "$GITHUB_TOKEN" ]; then echo "::error::GITHUB_TOKEN is empty."; exit 1; fi

      # pragent/pr-agent:0.49.0-github_action, pinned by its multi-platform index digest.
      - name: Review
        uses: docker://pragent/pr-agent@sha256:b1ed6e8de56eb4d6e4169ee0d5c209bb5ed1ef071a01c0c042c64b80192a785c
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened", "reopened", "ready_for_review", "synchronize"]'
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          # Describe would rewrite the pull request description.
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "false"
          GITHUB_ACTION_CONFIG.FAIL_ON_TOOL_ERRORS: "true"
          # Check-run output would turn off persistent finding state.
          GITHUB.PUBLISH_AS_CHECK_RUN: "false"

          CONFIG.MODEL: gpt-6.1-sol
          # Fail visibly rather than quietly reviewing with a weaker model.
          CONFIG.FALLBACK_MODELS: "[]"
          CONFIG.REASONING_EFFORT: high
          # Sized for complete reviews rather than low cost. Inputs stay under the 272K
          # long-context price tier; the output limit includes reasoning tokens.
          CONFIG.MAX_MODEL_TOKENS: "200000"
          CONFIG.MAX_OUTPUT_TOKENS: "64000"
          CONFIG.PATCH_EXTRA_LINES_BEFORE: "10"
          CONFIG.PATCH_EXTRA_LINES_AFTER: "5"
          CONFIG.AI_TIMEOUT: "600"
          CONFIG.PROPAGATE_TOOL_ERRORS: "true"
          CONFIG.RESTRICTED_MODE: "true"
          CONFIG.OUTPUT_RUN_DETAILS: "true"
          CONFIG.OUTPUT_RUN_COST: "true"

          PR_REVIEWER.PERSISTENT_COMMENT: "true"
          PR_REVIEWER.PERSISTENT_FINDING_STATE: "true"
          PR_REVIEWER.PUBLISH_OUTPUT_NO_SUGGESTIONS: "true"
          PR_REVIEWER.ENABLE_REVIEW_COVERAGE_FOOTER: "true"
          PR_REVIEWER.FINAL_UPDATE_MESSAGE: "false"
          PR_REVIEWER.INLINE_KEY_ISSUES: "true"
          PR_REVIEWER.NUM_MAX_FINDINGS: "10"
          PR_REVIEWER.ENABLE_LARGE_PR_CHUNKING: "true"
          PR_REVIEWER.MAX_NUMBER_OF_CALLS: "5"
          PR_REVIEWER.ENABLE_REVIEW_LABELS_SECURITY: "false"
          PR_REVIEWER.ENABLE_REVIEW_LABELS_EFFORT: "false"
          PR_REVIEWER.EXTRA_INSTRUCTIONS: |
            Lumibelle is a personal video studio, built with .NET and Blazor, that grows a screenplay into generated shots and a cut film.
            Focus on correctness, concurrency and cancellation, security, and data loss in storage code.
            Report only defects you can tie to a concrete failure: say what input or sequence of events goes wrong and what happens. Do not comment on style or naming.
            Do not report missing tests as a standalone finding. When you report a concrete defect, describe the focused test that would expose it.

          # Lockfile, esbuild output, evaluation and benchmark records, and binary assets.
          IGNORE.GLOB: >-
            ["package-lock.json",
            "src/Lumibelle.UI/wwwroot/script-editor.js",
            "src/Lumibelle.UI/wwwroot/prompt-editor.js",
            "docs/evaluations/**",
            "docs/h3/**",
            "**/*.png", "**/*.webp", "**/*.jpg", "**/*.svg", "**/*.woff2"]

  # PR-Agent cannot fail a check on its findings, so this job reads them back from the pull
  # request. It is separate from the review so that, after resolving a thread to dismiss a
  # finding, "Re-run failed jobs" turns it green without paying for another review.
  findings:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Fail on open findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The single-quoted $ names below are jq and GraphQL variables, not shell ones,
          # hence the SC2016 exceptions.
          set -euo pipefail
          open=0
          report() { echo "$1" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"; echo "$1"; }

          # The persistent summary comment, which the review job has just updated. Findings
          # that could not be attached to a line stay only here.
          # shellcheck disable=SC2016
          summary_id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- pr-agent:review:full -->"))) | .id' | tail -n 1)
          if [ -z "$summary_id" ]; then
            echo "::error::PR-Agent posted no review summary on this pull request."
            exit 1
          fi
          summary=$(gh api "repos/$REPO/issues/comments/$summary_id" --jq .body)
          summary_url=$(gh api "repos/$REPO/issues/comments/$summary_id" --jq .html_url)
          for marker in "No major issues detected" "No security concerns identified"; do
            if ! grep -qF "$marker" <<< "$summary"; then
              report "- The [review summary]($summary_url) does not say \"$marker\"."
              open=$((open + 1))
            fi
          done

          # Inline findings. A thread stops counting once it is resolved, or once a push
          # changes its lines and GitHub marks it outdated; the next review re-raises a
          # finding the change did not fix.
          # shellcheck disable=SC2016
          threads=$(gh api graphql --paginate -F owner="${REPO%/*}" -F name="${REPO#*/}" -F pr="$PR" -f query='
            query($owner: String!, $name: String!, $pr: Int!, $endCursor: String) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  reviewThreads(first: 100, after: $endCursor) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      isResolved
                      isOutdated
                      path
                      line
                      comments(first: 1) { nodes { author { login } url body } }
                    }
                  }
                }
              }
            }' --jq '.data.repository.pullRequest.reviewThreads.nodes[]
              | select((.isResolved | not) and (.isOutdated | not))
              | .comments.nodes[0] as $c
              | select(($c.author.login // "") | startswith("github-actions"))
              | "- [\(.path):\(.line // "file")](\($c.url)) \($c.body | split("\n")[0] | .[0:200])"')
          if [ -n "$threads" ]; then
            report "$threads"
            open=$((open + $(grep -c . <<< "$threads")))
          fi

          if [ "$open" -gt 0 ]; then
            echo "::error::$open open PR-Agent finding(s). Fix them, or resolve a thread to dismiss its finding and re-run this job."
            exit 1
          fi
          report "No open PR-Agent findings."
