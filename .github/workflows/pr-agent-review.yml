name: PR-Agent review

# Reviews each same-repository pull request with PR-Agent on the OpenAI API, billed to the
# API organization that holds OPENAI_KEY, through offloadr/pr-agent-review pinned by commit.
# The first review reads the whole pull request; later pushes are reviewed against the last
# checkpoint, and a verifier re-checks earlier findings. The findings job fails while any
# finding is open: fix it, or resolve its thread to dismiss it and re-run that job.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # There is deliberately no issue_comment trigger: the repository is public and PR-Agent
  # does not check who wrote a slash command, so any commenter could spend API credits.
  pr-agent:
    uses: offloadr/pr-agent-review/.github/workflows/pr-agent-review.yml@74d029ddd758dda17e995e1e286ed87c09b5e727
    # The findings job resolves PR-Agent's threads for fixed findings, which GitHub only
    # allows with contents: write. Neither job checks out or runs pull request code.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    secrets:
      OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
    with:
      model: gpt-6.1-sol
      instructions: |
        Lumibelle is a personal video studio, built with .NET and Blazor, that grows a screenplay into generated shots and a cut film.
        Focus on correctness, concurrency and cancellation, security, and data loss in storage code.
      # Lockfile, esbuild output, and evaluation and benchmark records. Binary files are left out already.
      ignore-glob: >-
        ["package-lock.json",
        "src/Lumibelle.UI/wwwroot/script-editor.js",
        "src/Lumibelle.UI/wwwroot/prompt-editor.js",
        "docs/evaluations/**",
        "docs/h3/**",
        "**/*.svg"]
