name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Package version, for example 1.2.3
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Empty outside releases; the publish scripts then use their development version.
  LUMIBELLE_VERSION: ${{ inputs.version }}

jobs:
  test:
    # Several store tests simulate failed publication with Windows file sharing locks.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress -y

      - run: npm ci

      - name: Check editor bundles are current
        run: node build/check-editor-bundles.mjs

      - name: JavaScript unit tests
        run: npm run test:unit

      - name: .NET tests
        run: dotnet test lumibelle.slnx -c Release --filter "Category!=Component"

      # bUnit component tests race their own background renders when the runner is busy,
      # so they run one class at a time after the rest of the suite.
      - name: .NET component tests
        run: dotnet test lumibelle.slnx -c Release --no-build --filter "Category=Component" -- xUnit.ParallelizeTestCollections=false

      - name: Shared studio browser flows
        env:
          LUMIBELLE_BROWSER_CONFIGURATION: Release
        run: npx playwright test script-polish.spec.js script-revisions.spec.js script-transport.spec.js unified-shots.spec.js text-assistance.spec.js cut.spec.js shared-host.spec.js

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet workload install maui-windows --skip-manifest-update

      - name: Publish self-contained folder
        shell: pwsh
        run: ./build/publish-windows.ps1 -Unpackaged

      - uses: actions/upload-artifact@v7
        with:
          name: lumibelle-windows-x64
          path: artifacts/packages/windows-win-x64/
          if-no-files-found: error

  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The pinned MacCatalyst SDK requires Xcode 26.0; the runner defaults to a newer Xcode.
      - run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - run: dotnet workload install maui-maccatalyst --skip-manifest-update

      - name: Publish unsigned package
        run: bash build/publish-macos.sh

      - uses: actions/upload-artifact@v7
        with:
          name: lumibelle-mac-unsigned
          path: src/Lumibelle.Desktop/bin/Release/**/*.pkg
          if-no-files-found: error
